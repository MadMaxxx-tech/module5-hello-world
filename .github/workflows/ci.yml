name: Build and release hello-world

on:
  push:
    branches:
      - master

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build Go application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build application
        run: |
          go build -ldflags "-X main.buildVersion=${VERSION}" \
            -o hello-world_${VERSION} .

      - name: Create archive
        run: |
          tar -czf hello-world_${VERSION}.tar.gz hello-world_${VERSION}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world_${VERSION}
          path: hello-world_${VERSION}.tar.gz

  release:
    name: Upload artifact to Nexus
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hello-world_${VERSION}
          path: .

      - name: Install curl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Upload artifact to Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -f -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            --upload-file "hello-world_${VERSION}.tar.gz" \
            "${{ vars.NEXUS_URL }}/repository/${{ vars.NEXUS_REPO }}/${VERSION}/hello-world_${VERSION}.tar.gz"
